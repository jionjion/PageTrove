name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint / Compile / Test / Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_ENABLE_IGNORED_BUILDS_ERROR: 'false'

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm compile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
